<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Álvaro Barchín Rubio · Software Engineer</title>
  <meta name="description" content="Software Engineer focused on backend architecture, DevOps and AI/RAG systems. Retro wrist-computer CV.">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&family=Yellowtail&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="unit metal" id="unit">
  <span class="screw" style="left:16px;top:14px"></span>
  <span class="screw" style="left:16px;bottom:16px;--r:70deg"></span>
  <span class="screw" style="left:226px;top:30px;--r:10deg"></span>
  <span class="screw r" style="right:134px;top:40px;--r:50deg"></span>
  <span class="screw r" style="right:134px;bottom:60px;--r:-15deg"></span>
  <div class="panel">
    <div class="gauge" aria-hidden="true"><span class="needle"></span></div>
    <div class="nameplate" aria-hidden="true">Barchín</div>
    <div class="vents" aria-hidden="true"><i></i><i></i><i></i></div>
    <span class="model">• Model 27 •</span>
    <div class="selector"><span class="scale"></span><button class="knob" id="knob" aria-label="Next section">
      <svg viewBox="-46 -46 92 92" fill="none" aria-hidden="true" focusable="false"><use href="assets/pipboy-3000.svg#selector-knob"/></svg>
    </button></div>
    <span class="side-label">SECTION</span>
    <button class="flash" id="flash" aria-label="Lamp" aria-pressed="false"></button>
  </div>
  <div class="wheel-slot"><button class="wheel" id="wheel" aria-label="Next item"></button></div>
  <div class="hood metal" aria-hidden="true"></div>
  <div class="bezel">
    <div class="screen">
      <div class="boot" id="boot" role="region" aria-label="System startup">
        <div class="boot-log" aria-hidden="true">
          <p class="boot-brand">PIP-BOY 3000</p>
          <p class="boot-version">PERSONAL INFORMATION PROCESSOR</p>
          <p class="boot-line" style="--delay:.35s">[OK] MEMORY CHECK</p>
          <p class="boot-line" style="--delay:.7s">[OK] DISPLAY INITIALIZED</p>
          <p class="boot-line" style="--delay:1.05s">[OK] PERSONNEL FILE LOADED</p>
          <p class="boot-line boot-ready" style="--delay:1.45s">SYSTEM READY _</p>
        </div>
        <button id="boot-skip" type="button">Skip startup</button>
      </div>
      <header class="hud" id="hud" inert></header>
      <main id="main" inert><div class="list" id="list"></div><div class="detail" id="detail" aria-live="polite"></div></main>
      <nav class="subs" role="tablist" id="subs" inert></nav>
    </div>
  </div>
  <div class="module metal">
    <div class="btns" id="btns" role="group" aria-label="Modes"></div>
    <div class="slots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="clamp metal" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><span class="bar"></span></div>
</div>
<button class="sound-toggle" id="sound-toggle" type="button" aria-label="Sound effects" aria-pressed="true" title="Mute sound effects">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
    <path d="M11 5 6 9H3v6h3l5 4z"/>
    <path class="sound-waves" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/>
    <path class="sound-off" d="m16 9 6 6m0-6-6 6"/>
  </svg>
</button>
<script src="js/main.js"></script>
</body>
</html>
